<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freedom Wall 💬</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #a36cf0;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      border: 12px solid;
      border-image: linear-gradient(45deg, #ff6f91, #ff4b6e);
      border-image-slice: 1;
      border-radius: 25px;
      color: white;
    }

    h1 {
      margin-top: 30px;
      font-size: 40px;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
    }

    textarea {
      width: 80%;
      height: 100px;
      margin-top: 20px;
      border-radius: 10px;
      border: none;
      padding: 10px;
      font-size: 16px;
      resize: none;
      outline: none;
    }

    button {
      margin-top: 15px;
      background: #ff6f91;
      color: white;
      border: none;
      padding: 10px 30px;
      border-radius: 25px;
      font-size: 18px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #ff4b6e;
    }

    .posts {
      margin-top: 30px;
      width: 80%;
    }

    .post {
      background: rgba(255,255,255,0.15);
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 15px;
      word-wrap: break-word;
      font-size: 16px;
      box-shadow: 0 0 5px rgba(0,0,0,0.2);
    }

    a.back {
      margin: 20px;
      text-decoration: none;
      color: white;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <a href="home.html" class="back">⬅ Back</a>
  <h1>Freedom Wall 💬</h1>

  <textarea id="message" placeholder="Type your message here..."></textarea>
  <button onclick="postMessage()">Post</button>

  <div class="posts" id="posts"></div>

  <script>
    const postsDiv = document.getElementById('posts');
    const savedPosts = JSON.parse(localStorage.getItem('freedomPosts')) || [];

    function displayPosts() {
      postsDiv.innerHTML = '';
      savedPosts.forEach((msg, index) => {
        const div = document.createElement('div');
        div.className = 'post';
        div.textContent = msg;
        postsDiv.appendChild(div);
      });
    }

    function postMessage() {
      const msg = document.getElementById('message').value.trim();
      if (msg !== '') {
        savedPosts.push(msg);
        localStorage.setItem('freedomPosts', JSON.stringify(savedPosts));
        document.getElementById('message').value = '';
        displayPosts();
      }
    }

    displayPosts();
  </script>
</body>
</html>
