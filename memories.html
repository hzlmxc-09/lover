<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memories 💭</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #a36cf0;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 12px solid;
      border-image: linear-gradient(45deg, #ff6f91, #ff4b6e);
      border-image-slice: 1;
      border-radius: 25px;
      color: white;
    }

    h1 {
      margin-top: 30px;
      font-size: 40px;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
    }

    .memories {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 90%;
      margin-top: 20px;
    }

    .memory {
      background: rgba(255,255,255,0.15);
      border-radius: 15px;
      padding: 20px;
      margin: 10px;
      text-align: center;
      box-shadow: 0 0 5px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 400px;
    }

    a.back {
      margin: 20px;
      text-decoration: none;
      color: white;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <a href="home.html" class="back">⬅ Back</a>
  <h1>Our Memories 💭</h1>

  <div class="memories">
    <div class="memory">
      <p>💌 The day we first met — I still remember how shy we were.</p>
    </div>
    <div class="memory">
      <p>🌙 Late night talks that made me fall harder every time.</p>
    </div>
    <div class="memory">
      <p>💜 The laughter, the little arguments, and how we always find our way back.</p>
    </div>
  </div>
</body>
</html>
