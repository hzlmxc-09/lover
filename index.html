<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #a36cf0; /* Purple background */
      border: 10px solid transparent;
      border-image: linear-gradient(45deg, #ff6f91, #ff4b6e);
      border-image-slice: 1;
      border-radius: 25px;
    }

    h1 {
      font-size: 100px;
      font-family: 'Georgia', cursive;
      color: white;
      margin: 0;
      text-shadow: 4px 4px 10px rgba(0, 0, 0, 0.3);
    }

    p {
      font-size: 18px;
      color: #fff0f5;
      font-style: italic;
      margin-top: 10px;
      max-width: 80%;
      text-align: center;
    }

    /* Optional: fade-in animation */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1, p {
      animation: fadeIn 2s ease forwards;
    }
  </style>
</head>
<body>
  <h1>LOVE</h1>
  <p>“Higugmaon tika bata man ta or tigulang na.”</p>
</body>
</html>
