<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #a36cf0;
      border: 12px solid;
      border-image: linear-gradient(45deg, #ff6f91, #ff4b6e);
      border-image-slice: 1;
      border-radius: 25px;
      position: relative;
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
      animation: glow 5s ease-in-out infinite;
    }

    @keyframes glow {
      0% { box-shadow: 0 0 10px #ff6f91, 0 0 20px #ff4b6e; }
      50% { box-shadow: 0 0 25px #ff4b6e, 0 0 40px #ff6f91; }
      100% { box-shadow: 0 0 10px #ff6f91, 0 0 20px #ff4b6e; }
    }

    h1 {
      font-size: 100px;
      color: white;
      text-shadow: 4px 4px 10px rgba(0, 0, 0, 0.3);
      margin: 0;
      animation: fadeIn 2s ease forwards;
    }

    p {
      font-size: 18px;
      color: #fff0f5;
      font-style: italic;
      margin-top: 10px;
      text-align: center;
      animation: fadeIn 3s ease forwards;
    }

    button {
      position: absolute;
      bottom: 30px;
      right: 30px;
      background: #ff6f91;
      color: white;
      border: none;
      padding: 12px 30px;
      font-size: 18px;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      transition: all 0.3s ease;
    }

    button:hover {
      background: #ff4b6e;
      transform: scale(1.05);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <h1>LOVE</h1>
  <p>“Higugmaon tika ma bata man or tigulang na.”</p>
  <button onclick="window.location.href='home.html'">Open 💌</button>
</body>
</html>
